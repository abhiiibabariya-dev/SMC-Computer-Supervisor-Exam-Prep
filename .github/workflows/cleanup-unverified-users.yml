name: Cleanup Unverified Accounts

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove stale unverified accounts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL: https://smc-exam-prep-38d22-default-rtdb.asia-southeast1.firebasedatabase.app
          ADMIN_UID: OfRWMa7HZgVYQrq4fzLjU3Wl30ml
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo 'FIREBASE_SERVICE_ACCOUNT_JSON is not configured. Cleanup is safely skipped.'
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-service-account.json
          chmod 600 /tmp/firebase-service-account.json
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@latest
          node <<'NODE'
          (async () => {
            const fs = require('fs');
            const { initializeApp, cert } = require('firebase-admin/app');
            const { getAuth } = require('firebase-admin/auth');
            const { getDatabase } = require('firebase-admin/database');

            const serviceAccount = JSON.parse(fs.readFileSync('/tmp/firebase-service-account.json','utf8'));
            const app = initializeApp({
              credential: cert(serviceAccount),
              databaseURL: process.env.FIREBASE_DATABASE_URL
            });
            const auth = getAuth(app);
            const db = getDatabase(app);
            const adminUid = process.env.ADMIN_UID;
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            let nextPageToken;
            let scanned = 0;
            let removed = 0;

            do {
              const page = await auth.listUsers(1000, nextPageToken);
              for (const u of page.users) {
                scanned++;
                if (u.uid === adminUid) continue;
                const created = new Date(u.metadata.creationTime || 0).getTime();
                const stale = created > 0 && created < cutoff;
                const incomplete = !u.emailVerified || !u.phoneNumber;
                if (!stale || !incomplete) continue;
                await auth.deleteUser(u.uid);
                await db.ref('users/' + u.uid).remove().catch(() => {});
                removed++;
                console.log(`Removed stale unverified account: ${u.uid}`);
              }
              nextPageToken = page.pageToken;
            } while (nextPageToken);

            console.log(`Account cleanup complete. Scanned=${scanned}, removed=${removed}`);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
          rm -f /tmp/firebase-service-account.json
