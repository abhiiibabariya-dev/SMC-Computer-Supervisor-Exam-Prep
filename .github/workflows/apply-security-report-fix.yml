name: Apply security report fix

on:
  push:
    paths:
      - '.github/scripts/apply-security-report-fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply report branding and identity enrichment
        run: python3 .github/scripts/apply-security-report-fix.py

      - name: Commit patch and remove one-time fixer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/daily-security-log.yml
          git rm -f .github/scripts/apply-security-report-fix.py .github/workflows/apply-security-report-fix.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: brand security report and preserve visitor identity'
          git push
