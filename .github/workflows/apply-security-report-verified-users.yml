name: Apply Verified Security Report Identity Fix

on:
  push:
    paths:
      - '.github/scripts/patch-security-report-verified-users.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch security report
        run: python3 .github/scripts/patch-security-report-verified-users.py

      - name: Commit patch and remove one-time fixer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/daily-security-log.yml
          git rm -f .github/scripts/patch-security-report-verified-users.py .github/workflows/apply-security-report-verified-users.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: use verified profile identity in security report'
          git push
