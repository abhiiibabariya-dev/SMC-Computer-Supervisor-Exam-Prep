name: Deploy SMC Prep to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Prepare site
        shell: python
        run: |
          from pathlib import Path
          import os,re,shutil
          source=Path('docs');site=Path('_site')
          required=['index.html','login.html','gate.js','firebase-config.js','subscription.js','subscription-payments.js','profile.js','profile-bootstrap.js','activity-audit.js','login-audit.js','animations.css','transitions.js','leaderboard-safety.js']
          for f in required:
              if not (source/f).is_file(): raise SystemExit(f'docs/{f} is missing')
          if site.exists(): shutil.rmtree(site)
          shutil.copytree(source,site);(site/'.nojekyll').touch()
          gate=site/'gate.js';sub=site/'subscription.js';pay=site/'subscription-payments.js';profile=site/'profile.js';boot=site/'profile-bootstrap.js';activity=site/'activity-audit.js';loginaudit=site/'login-audit.js';animations=site/'animations.css';transitions=site/'transitions.js';leaderboardsafety=site/'leaderboard-safety.js'
          changed=[]
          for page in site.rglob('*.html'):
              if page.name.lower()=='login.html':
                  text=page.read_text(encoding='utf-8',errors='ignore')
                  for script in (boot,loginaudit,transitions,leaderboardsafety):
                      text=re.sub(r'\s*<script\s+[^>]*src=["\'][^"\']*'+re.escape(script.name)+r'(?:\?[^"\']*)?["\'][^>]*>\s*</script>','',text,flags=re.I)
                  pos=text.lower().find('</head>')
                  if pos>=0:
                      css=os.path.relpath(animations,page.parent).replace('\\','/')
                      if not re.search(r'<link\s+[^>]*href=["\'][^"\']*'+re.escape(os.path.basename(css))+r'["\'][^>]*>',text,re.I):
                          text=text[:pos]+f'\n<link rel="stylesheet" href="{css}">\n'+text[pos:]
                          pos=text.lower().find('</head>')
                      rel=os.path.relpath(boot,page.parent).replace('\\','/')
                      text=text[:pos]+f'\n<script src="{rel}"></script>\n'+text[pos:]
                  end=text.lower().rfind('</body>')
                  if end>=0:
                      rel=os.path.relpath(loginaudit,page.parent).replace('\\','/')
                      text=text[:end]+f'\n<script src="{rel}"></script>\n'+text[end:]
                      rel=os.path.relpath(transitions,page.parent).replace('\\','/')
                      text=text[:end]+f'\n<script src="{rel}"></script>\n'+text[end:]
                      rel=os.path.relpath(leaderboardsafety,page.parent).replace('\\','/')
                      text=text[:end]+f'\n<script src="{rel}"></script>\n'+text[end:]
                  page.write_text(text,encoding='utf-8');changed.append(str(page));continue
              text=page.read_text(encoding='utf-8',errors='ignore')
              for script in (gate,sub,pay,profile,boot,activity,transitions,leaderboardsafety):
                  text=re.sub(r'\s*<script\s+[^>]*src=["\'][^"\']*'+re.escape(script.name)+r'(?:\?[^"\']*)?["\'][^>]*>\s*</script>','',text,flags=re.I)
              rel=lambda p:os.path.relpath(p,page.parent).replace('\\','/')
              head=text.lower().find('</head>')
              if head<0: continue
              css=rel(animations)
              if not re.search(r'<link\s+[^>]*href=["\'][^"\']*'+re.escape(os.path.basename(css))+r'["\'][^>]*>',text,re.I):
                  text=text[:head]+f'\n<link rel="stylesheet" href="{css}">\n'+text[head:]
                  head=text.lower().find('</head>')
              if page.name.lower()=='index.html':
                  text=text[:head]+f'\n<script src="{rel(activity)}"></script>\n'+text[head:]
                  end=text.lower().rfind('</body>')
                  if end>=0:
                      text=text[:end]+f'\n<script src="{rel(transitions)}"></script>\n<script src="{rel(leaderboardsafety)}"></script>\n'+text[end:]
                  page.write_text(text,encoding='utf-8');changed.append(str(page));continue
              tags=[f'<script src="{rel(gate)}?v=20260821"></script>',f'<script src="{rel(sub)}"></script>',f'<script src="{rel(activity)}"></script>',f'<script src="{rel(leaderboardsafety)}"></script>']
              # client-dashboard has its own complete Firebase account renderer.
              # Do not inject the legacy profile.js renderer or the subscription card appears twice.
              updated=text[:head]+'\n'+'\n'.join(tags)+'\n'+text[head:]
              if page.name.lower()=='premium.html':
                  end=updated.lower().rfind('</body>')
                  if end>=0:updated=updated[:end]+f'\n<script src="{rel(pay)}"></script>\n'+updated[end:]
              end=updated.lower().rfind('</body>')
              if end>=0:updated=updated[:end]+f'\n<script src="{rel(transitions)}"></script>\n'+updated[end:]
              page.write_text(updated,encoding='utf-8');changed.append(str(page))
          print(f'Prepared {len(changed)} HTML pages')
      - name: Validate published site
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/login.html
          test -f _site/gate.js
          test -f _site/subscription.js
          test -f _site/subscription-payments.js
          test -f _site/firebase-config.js
          test -f _site/profile-bootstrap.js
          test -f _site/activity-audit.js
          test -f _site/login-audit.js
          test -f _site/animations.css
          test -f _site/transitions.js
          test -f _site/leaderboard-safety.js
          ! grep -q 'gate.js' _site/index.html
          ! grep -q 'smcAuthOverlay' _site/index.html
          ! grep -q 'Secure Firebase authentication could not be initialized' _site/index.html
          grep -q 'activity-audit.js' _site/index.html
          grep -q 'animations.css' _site/index.html
          grep -q 'transitions.js' _site/index.html
          grep -q 'leaderboard-safety.js' _site/leaderboard.html
          grep -q 'leaderboard-safety.js' _site/quiz.html
          grep -q 'animations.css' _site/login.html
          grep -q 'transitions.js' _site/login.html
          grep -q 'subscription.js' _site/mock-test.html
          grep -q 'subscription-payments.js' _site/premium.html
          ! grep -q 'profile.js' _site/client-dashboard.html
          grep -q 'animations.css' _site/client-dashboard.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
