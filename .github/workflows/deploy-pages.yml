name: Deploy SMC Prep to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare site
        shell: python
        run: |
          from pathlib import Path
          import os,re,shutil
          source=Path('docs');site=Path('_site')
          required=['index.html','login.html','gate.js','firebase-config.js','subscription.js','subscription-payments.js','profile.js','profile-bootstrap.js']
          for f in required:
              if not (source/f).is_file(): raise SystemExit(f'docs/{f} is missing')
          if site.exists(): shutil.rmtree(site)
          shutil.copytree(source,site);(site/'.nojekyll').touch()
          gate=site/'gate.js';sub=site/'subscription.js';pay=site/'subscription-payments.js';profile=site/'profile.js';boot=site/'profile-bootstrap.js'
          changed=[]
          for page in site.rglob('*.html'):
              if page.name.lower()=='login.html':
                  text=page.read_text(encoding='utf-8',errors='ignore')
                  text=re.sub(r'\s*<script\s+[^>]*src=["\'][^"\']*profile-bootstrap\.js["\'][^>]*>\s*</script>','',text,flags=re.I)
                  pos=text.lower().find('</head>')
                  if pos>=0:
                      rel=os.path.relpath(boot,page.parent).replace('\\','/')
                      text=text[:pos]+f'\n<script src="{rel}"></script>\n'+text[pos:]
                  page.write_text(text,encoding='utf-8');changed.append(str(page));continue
              text=page.read_text(encoding='utf-8',errors='ignore')
              for script in (gate,sub,pay,profile,boot):
                  text=re.sub(r'\s*<script\s+[^>]*src=["\'][^"\']*'+re.escape(script.name)+r'["\'][^>]*>\s*</script>','',text,flags=re.I)
              head=text.lower().find('</head>')
              if head<0: continue
              rel=lambda p:os.path.relpath(p,page.parent).replace('\\','/')
              tags=[f'<script src="{rel(gate)}"></script>',f'<script src="{rel(sub)}"></script>']
              if page.name.lower()=='client-dashboard.html':tags.append(f'<script src="{rel(profile)}"></script>')
              updated=text[:head]+'\n'+'\n'.join(tags)+'\n'+text[head:]
              if page.name.lower()=='premium.html':
                  # Load payment/entitlement override after the page's legacy inline scripts.
                  # This is important because premium.html still contains the old client-side
                  # verifyPayment function; the Firebase-backed implementation must win.
                  end=updated.lower().rfind('</body>')
                  if end>=0:updated=updated[:end]+f'\n<script src="{rel(pay)}"></script>\n'+updated[end:]
              page.write_text(updated,encoding='utf-8');changed.append(str(page))
          print(f'Prepared {len(changed)} authenticated HTML pages')
      - name: Validate published site
        run: |
          test -f _site/index.html
          test -f _site/login.html
          test -f _site/gate.js
          test -f _site/subscription.js
          test -f _site/subscription-payments.js
          test -f _site/firebase-config.js
          test -f _site/profile-bootstrap.js
          grep -q 'gate.js' _site/index.html
          grep -q 'subscription.js' _site/mock-test.html
          grep -q 'subscription-payments.js' _site/premium.html
          grep -q 'profile.js' _site/client-dashboard.html
          grep -q 'profile-bootstrap.js' _site/login.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
