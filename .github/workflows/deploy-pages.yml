name: Deploy SMC Prep to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Gujarat Government Jobs Monitor"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Prepare site
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os,re,shutil
          source=Path('docs');site=Path('_site')
          required=['index.html','login.html','gate.js','firebase-config.js','subscription.js','subscription-payments.js','profile.js','profile-bootstrap.js','activity-audit.js','login-audit.js','animations.css','transitions.js','leaderboard-safety.js','quizscore-auth.js','smc-live-sync.js','site-nav.js']
          for f in required:
              if not (source/f).is_file(): raise SystemExit(f'docs/{f} is missing')
          if site.exists(): shutil.rmtree(site)
          shutil.copytree(source,site);(site/'.nojekyll').touch()
          home=site/'index.html';html=home.read_text(encoding='utf-8',errors='ignore')
          today=datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%d %B %Y')
          html=re.sub(r'Last updated:\s*.*?\s*&middot;',f'Last updated: {today} &middot;',html,count=1,flags=re.I)
          html=re.sub(r'NOW\s*[—-]\s*Post-Exam Updates','NOW — Final Revision / Exam Preparation',html,flags=re.I)
          html=re.sub(r'Final revision phase\. Practice mock tests & daily MCQs\. Exam completed — post-exam updates are active\.', 'Final revision phase. Practice mock tests & daily MCQs. Computer Supervisor written exam is scheduled for 6 September 2026.', html, flags=re.I)
          html=html.replace('Exam completed — post-exam updates are active','Computer Supervisor exam preparation is active.')
          html=re.sub(r'Post-exam status\s*(?:✓\s*)+', 'Final revision phase — ', html, flags=re.I)
          html=re.sub(r'SMC written exam scheduled for 6 September 2026\s*\([^)]*\)', 'SMC Computer Supervisor written exam scheduled for 6 September 2026', html, flags=re.I)
          html=re.sub(r'Written Exam:\s*Completed on 12 July 2026', 'Written Exam: Scheduled for 6 September 2026', html, flags=re.I)
          html=re.sub(r'EXAM\s+12\s+JUL', 'EXAM 6 SEP', html, flags=re.I)
          html=re.sub(r'Exam Completed\s*[—-]\s*6 September 2026', 'Exam Scheduled — 6 September 2026', html, flags=re.I)
          html=re.sub(r'Exam completed\. Track official answer key, result and selection updates\.', 'Verify the official SMC call letter and track official exam-day, answer-key, result and selection updates.', html, flags=re.I)
          html=re.sub(r'OMR objective test \(Clerk, Staff Nurse, Driver, PRO & more\)', 'OMR objective test — Supervisor (Computer), Junior Pharmacist, Assistant Auditor & Technical Officer', html, flags=re.I)
          html=re.sub(r'Written examination — verify final centre and reporting time on the official SMC call letter\.', 'Written examination — Supervisor (Computer), Junior Pharmacist, Assistant Auditor & Technical Officer. Verify final centre and reporting time on the official SMC call letter.', html, flags=re.I)
          html=re.sub(r'Crack the SMC 2026 exam \(Clerk · Staff Nurse · Driver · PRO\)\.', 'Prepare for the SMC 2026 Computer Supervisor examination.', html, flags=re.I)
          html=re.sub(r'EXAM SCHEDULED — 6 SEPTEMBER 2026 — Final Revision Time!', 'EXAM SCHEDULED — 6 SEPTEMBER 2026 — Computer Supervisor Final Revision', html, flags=re.I)
          html=re.sub(r'SMC Public Relation Officer Written Examination 2026', 'SMC Computer Supervisor Written Examination 2026', html, flags=re.I)
          html=html.replace('Computer Supv','Supervisor (Computer)')
          html=html.replace('12 July 2026','6 September 2026').replace('12 JULY 2026','6 SEPTEMBER 2026')
          home.write_text(html,encoding='utf-8')
          gate=site/'gate.js';sub=site/'subscription.js';pay=site/'subscription-payments.js';profile=site/'profile.js';boot=site/'profile-bootstrap.js';activity=site/'activity-audit.js';loginaudit=site/'login-audit.js';animations=site/'animations.css';transitions=site/'transitions.js';leaderboardsafety=site/'leaderboard-safety.js';quizscoreauth=site/'quizscore-auth.js';sitenav=site/'site-nav.js'
          changed=[]
          for page in site.rglob('*.html'):
              text=page.read_text(encoding='utf-8',errors='ignore');rel=lambda p:os.path.relpath(p,page.parent).replace('\\','/');head=text.lower().find('</head>')
              if head<0: continue
              text=re.sub(r'\s*<script\s+[^>]*src=["\'][^"\']*site-nav\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>','',text,flags=re.I);head=text.lower().find('</head>');text=text[:head]+f'\n<script src="{rel(sitenav)}?v=20260825"></script>\n'+text[head:]
              if page.name.lower()=='login.html':
                  for script in (boot,loginaudit,transitions,leaderboardsafety,quizscoreauth): text=re.sub(r'\s*<script\s+[^>]*src=["\'][^"\']*'+re.escape(script.name)+r'(?:\?[^"\']*)?["\'][^>]*>\s*</script>','',text,flags=re.I)
                  head=text.lower().find('</head>');css=rel(animations)
                  if not re.search(r'<link\s+[^>]*href=["\'][^"\']*animations\.css(?:\?[^"\']*)?["\'][^>]*>',text,re.I): text=text[:head]+f'\n<link rel="stylesheet" href="{css}">\n'+text[head:];head=text.lower().find('</head>')
                  text=text[:head]+f'\n<script src="{rel(boot)}"></script>\n'+text[head:];end=text.lower().rfind('</body>')
                  if end>=0:
                      for script in (loginaudit,transitions,leaderboardsafety): text=text[:end]+f'\n<script src="{rel(script)}"></script>\n'+text[end:]
                  page.write_text(text,encoding='utf-8');changed.append(str(page));continue
              for script in (gate,sub,pay,profile,boot,activity,transitions,leaderboardsafety,quizscoreauth): text=re.sub(r'\s*<script\s+[^>]*src=["\'][^"\']*'+re.escape(script.name)+r'(?:\?[^"\']*)?["\'][^>]*>\s*</script>','',text,flags=re.I)
              head=text.lower().find('</head>');css=rel(animations)
              if not re.search(r'<link\s+[^>]*href=["\'][^"\']*animations\.css(?:\?[^"\']*)?["\'][^>]*>',text,re.I): text=text[:head]+f'\n<link rel="stylesheet" href="{css}">\n'+text[head:];head=text.lower().find('</head>')
              if page.name.lower()=='index.html':
                  text=text[:head]+f'\n<script src="{rel(activity)}"></script>\n'+text[head:];end=text.lower().rfind('</body>')
                  if end>=0:text=text[:end]+f'\n<script src="{rel(transitions)}"></script>\n<script src="{rel(leaderboardsafety)}"></script>\n'+text[end:]
                  page.write_text(text,encoding='utf-8');changed.append(str(page));continue
              tags=[f'<script src="{rel(gate)}?v=20260825"></script>',f'<script src="{rel(sub)}"></script>',f'<script src="{rel(activity)}"></script>',f'<script src="{rel(leaderboardsafety)}"></script>']
              if page.name.lower()!='client-dashboard.html':tags.append(f'<script src="{rel(profile)}"></script>')
              if page.name.lower()=='daily-quiz.html':tags.append(f'<script src="{rel(quizscoreauth)}"></script>')
              text=text[:head]+'\n'+'\n'.join(tags)+'\n'+text[head:]
              if page.name.lower()=='premium.html': end=text.lower().rfind('</body>');text=text[:end]+f'\n<script src="{rel(pay)}"></script>\n'+text[end:] if end>=0 else text
              end=text.lower().rfind('</body>');text=text[:end]+f'\n<script src="{rel(transitions)}"></script>\n'+text[end:] if end>=0 else text
              page.write_text(text,encoding='utf-8');changed.append(str(page))
          print(f'Prepared {len(changed)} HTML pages with universal navigation')
      - name: Validate published site and JavaScript
        run: |
          set -euo pipefail
          for f in index.html login.html gate.js firebase-config.js subscription.js subscription-payments.js profile.js profile-bootstrap.js activity-audit.js login-audit.js animations.css transitions.js leaderboard-safety.js quizscore-auth.js smc-live-sync.js site-nav.js; do test -f "_site/$f"; done
          ! grep -q 'src="gate.js' _site/index.html
          ! grep -q 'smcAuthOverlay' _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          text=Path('_site/index.html').read_text(encoding='utf-8',errors='ignore')
          required=['6 SEPTEMBER 2026','Supervisor (Computer)','Final Revision']
          for needle in required:
              if needle.lower() not in text.lower(): raise SystemExit(f'Missing required current-state text: {needle}')
          stale=['12 July 2026','12 JULY 2026','NOW — Post-Exam Updates','Exam completed — post-exam updates are active','EXAM COMPLETED — 12 JULY 2026','Written Exam: Completed on 12 July 2026']
          for needle in stale:
              if needle.lower() in text.lower(): raise SystemExit(f'Stale homepage state detected: {needle}')
          print('Homepage current-state validation passed.')
          PY
          grep -q 'site-nav.js' _site/login.html; grep -q 'site-nav.js' _site/live-jobs.html; grep -q 'site-nav.js' _site/govt-jobs.html
          grep -q 'transitions.js' _site/index.html; grep -q 'leaderboard-safety.js' _site/leaderboard.html; grep -q 'leaderboard-safety.js' _site/quiz.html
          grep -q 'animations.css' _site/login.html; grep -q 'transitions.js' _site/login.html; grep -q 'profile-bootstrap.js' _site/login.html; grep -q 'login-audit.js' _site/login.html
          grep -q 'subscription.js' _site/mock-test.html; grep -q 'subscription-payments.js' _site/premium.html; grep -q 'quizscore-auth.js' _site/daily-quiz.html
          ! grep -q 'profile.js' _site/client-dashboard.html; grep -q 'profile.js' _site/premium.html; grep -q 'animations.css' _site/client-dashboard.html
          for f in site-nav.js gate.js profile-bootstrap.js profile.js activity-audit.js login-audit.js transitions.js leaderboard-safety.js subscription.js subscription-payments.js quizscore-auth.js smc-live-sync.js; do node --check "_site/$f"; done
          echo 'Pages build validation passed.'
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
