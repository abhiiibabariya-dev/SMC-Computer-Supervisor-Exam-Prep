name: Deploy SMC Prep to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site
        shell: python
        run: |
          from pathlib import Path
          import os, re, shutil

          source = Path('docs')
          site = Path('_site')
          if not (source / 'index.html').is_file():
              raise SystemExit('docs/index.html is missing')
          if not (source / 'gate.js').is_file():
              raise SystemExit('docs/gate.js is missing')
          if not (source / 'firebase-config.js').is_file():
              raise SystemExit('docs/firebase-config.js is missing')

          if site.exists():
              shutil.rmtree(site)
          shutil.copytree(source, site)
          (site / '.nojekyll').touch()

          # Inject one correct relative authentication gate into every HTML page.
          # This keeps the existing GitHub Pages project URL unchanged and also
          # works for pages inside nested directories.
          gate = site / 'gate.js'
          changed = []
          for page in site.rglob('*.html'):
              if page.name.lower() == 'login.html':
                  continue
              text = page.read_text(encoding='utf-8', errors='ignore')
              cleaned = re.sub(
                  r'\s*<script\s+[^>]*src=["\'][^"\']*gate\.js["\'][^>]*>\s*</script>',
                  '', text, flags=re.I
              )
              marker = '</head>'
              pos = cleaned.lower().find(marker)
              if pos < 0:
                  continue
              rel = os.path.relpath(gate, page.parent).replace('\\', '/')
              tag = f'    <script src="{rel}"></script>\n'
              updated = cleaned[:pos] + tag + cleaned[pos:]
              if updated != text:
                  page.write_text(updated, encoding='utf-8')
                  changed.append(str(page))

          print(f'Prepared {len(changed)} authenticated HTML pages')

      - name: Validate published site
        run: |
          test -f _site/index.html
          test -f _site/login.html
          test -f _site/gate.js
          test -f _site/firebase-config.js
          grep -q 'gate.js' _site/index.html
          ! grep -q 'gate.js' _site/login.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
