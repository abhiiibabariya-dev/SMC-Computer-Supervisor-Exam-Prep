name: Gujarat Govt Jobs Hub Live Sync

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/site-live-sync.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gujarat-govt-jobs-hub-live-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Normalize branding, live sync and stale exam text
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('docs')
          tag = '<script src="smc-live-sync.js?v=20260821"></script>'
          rx = re.compile(r'<script\s+[^>]*src=["\'][^"\']*smc-live-sync\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)

          changed = []
          for p in root.rglob('*.html'):
            if p.name.lower().endswith('.backup.html'):
              continue

            t = p.read_text(encoding='utf-8', errors='ignore')
            old = t

            t = re.sub(r'(?:Gujarat Govt Jobs Hub\s*\|\s*)+', 'Gujarat Govt Jobs Hub | ', t)
            t = re.sub(r'(?<!Gujarat Govt Jobs Hub \| )SMC Exam Prep 2026',
                        'Gujarat Govt Jobs Hub | SMC Exam Prep 2026', t)
            t = t.replace('SMC Prep', 'Gujarat Govt Jobs Hub')
            t = re.sub(r'(?:Gujarat Govt Jobs Hub\s*\|\s*)+', 'Gujarat Govt Jobs Hub | ', t)

            replacements = [
              ('🔥 EXAM ON 12 JULY 2026 — Final Revision Time! Tap for the Exam-Day Guide', '✅ EXAM COMPLETED — 12 JULY 2026 | Answer Key & Result Updates'),
              ('📅 EXAM DATE OUT — Written Exam on 12 July 2026! Call Letter Coming Soon', '✅ EXAM COMPLETED — Written Exam held on 12 July 2026'),
              ('Call Letter Coming Soon', 'Call Letter Phase Closed'),
              ('Exam Date, Admit Card — Not Yet Announced', 'Exam Completed — 12 July 2026'),
              ('NOW — Exam Prep', 'NOW — Post-Exam Updates'),
              ('Before 12 July 2026', 'Before 12 July 2026 ✓'),
              ('Written Exam: To Be Announced', 'Written Exam: Completed on 12 July 2026'),
              ('Admit Card: Coming Soon', 'Admit Card: Phase Closed'),
              ('Exam is close!', 'Exam completed — post-exam updates are active.'),
            ]
            for a, b in replacements:
              t = t.replace(a, b)

            lines = t.splitlines(True)
            seen_end = False
            out = []
            for line in lines:
              if '"endDate": "2026-07-12T13:00:00+05:30"' in line:
                if seen_end:
                  continue
                seen_end = True
              out.append(line)
            t = ''.join(out)

            matches = list(rx.finditer(t))
            if len(matches) == 0:
              pos = t.lower().find('</head>')
              if pos >= 0:
                t = t[:pos] + '    ' + tag + '\n' + t[pos:]
            elif len(matches) > 1:
              t = rx.sub('', t)
              pos = t.lower().find('</head>')
              if pos >= 0:
                t = t[:pos] + '    ' + tag + '\n' + t[pos:]
            elif matches[0].group(0) != tag:
              m = matches[0]
              t = t[:m.start()] + tag + t[m.end():]

            if t != old:
              p.write_text(t, encoding='utf-8')
              changed.append(str(p))

          print('Changed', len(changed), 'HTML pages')

      - name: Commit real changes and trigger Pages deployment
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: rebrand site and sync status'
          git push origin HEAD:master
