name: Enforce Unified Authentication

on:
  workflow_dispatch: {}
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: write

concurrency:
  group: smc-auth-gate
  cancel-in-progress: true

jobs:
  protect-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Inject unified auth gate into protected HTML pages
        shell: python
        run: |
          from pathlib import Path
          import os, re

          root = Path('docs')
          if not root.exists():
              raise SystemExit('docs directory not found')

          changed = []
          for path in root.rglob('*.html'):
              name = path.name.lower()
              if name in {'index.html', 'login.html', '404.html'} or name.endswith('.backup.html'):
                  continue

              text = path.read_text(encoding='utf-8', errors='ignore')
              text2 = re.sub(
                  r'\s*<script\s+[^>]*src=["\'][^"\']*gate\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>',
                  '', text, flags=re.I
              )
              marker = '</head>'
              pos = text2.lower().find(marker)
              if pos < 0:
                  continue

              rel_gate = os.path.relpath(root / 'gate.js', path.parent).replace('\\', '/')
              tag = f'    <script src="{rel_gate}?v=20260821"></script>\n'
              text2 = text2[:pos] + tag + text2[pos:]

              if text2 != text:
                  path.write_text(text2, encoding='utf-8')
                  changed.append(str(path))

          print(f'Protected {len(changed)} HTML pages')
          for item in changed:
              print(' -', item)

      - name: Commit page protection changes and trigger deployment
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No HTML changes required."
            exit 0
          fi
          git commit -m "chore: enforce authentication on protected pages"
          git push origin HEAD:master
