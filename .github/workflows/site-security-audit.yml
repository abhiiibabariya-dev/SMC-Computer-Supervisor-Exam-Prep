name: Site Security Audit

on:
  push:
    branches: [master]
    paths:
      - 'firebase-rules.json'
      - 'docs/**'
      - '.github/workflows/**'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Gujarat Government Jobs Monitor"]
    types: [completed]

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Firebase rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          rules = json.loads(Path('firebase-rules.json').read_text(encoding='utf-8'))['rules']
          admin = "lower(auth.token.email) === 'abhibabariya007@gmail.com'"
          assert rules['.read'] is False and rules['.write'] is False
          users = rules['users']['$uid']
          assert 'auth.uid === $uid' in users['.read']
          assert '!data.exists()' in users['.write']
          assert admin in users['.write']
          assert 'auth.token.email_verified === true' in users['emailVerified']['.write']
          assert admin in users['entitlements']['.write']
          assert 'mockTests' in users['.validate'] and 'fullAccess' in users['.validate']
          for key in ('visits','clicks','leads','security','quizscores'):
              assert 'auth !== null' in rules[key]['$id']['.write']
              assert '.validate' in rules[key]['$id']
          assert admin in rules['leaderboard']['$id']['.write']
          assert 'auth.uid' in rules['leaderboard_public']['$id']['.write']
          assert 'fullAccess' in rules['premium_content']['$resource']['.read']
          print('Firebase rules: PASS')
          PY

      - name: Validate critical JavaScript
        shell: bash
        run: |
          set -euo pipefail
          files="docs/gate.js docs/profile-bootstrap.js docs/activity-audit.js docs/login-audit.js docs/leaderboard-safety.js docs/quizscore-auth.js docs/auto-live-jobs.js docs/smc-live-sync.js docs/subscription.js docs/subscription-payments.js docs/site-nav.js docs/transitions.js"
          for f in $files; do
            test -f "$f"
            node --check "$f"
          done
          grep -q 'firebase.initializeApp' docs/login.html
          grep -q 'sendEmailVerification' docs/login.html
          grep -q 'emailVerified' docs/gate.js
          echo 'JavaScript/auth checks: PASS'

      - name: Scan client files for obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(FIREBASE_SECRET|databaseSecret|client_secret|private_key)[[:space:]]*[:=]' docs --include='*.js' --include='*.html' --include='*.json'; then
            echo 'Potential client-side secret found.'
            exit 1
          fi
          echo 'Client secret scan: PASS'

      - name: Validate page gates and branding
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'login.html':true" docs/gate.js
          grep -q "'privacy-policy.html':true" docs/gate.js
          grep -q "'terms-conditions.html':true" docs/gate.js
          ! grep -q 'gate.js' docs/index.html
          ! grep -q 'gate.js' docs/login.html
          for f in docs/live-jobs.html docs/govt-jobs.html docs/answer-key.html docs/client-dashboard.html docs/premium.html docs/mock-test.html; do
            test -f "$f"
            grep -q 'gate.js' "$f"
          done
          if grep -RInE 'Gujarat Govt Jobs Hub[[:space:]]*\|[[:space:]]*Gujarat Govt Jobs Hub' docs --include='*.html'; then exit 1; fi
          if grep -RIn '\[skip ci\]' .github/workflows --include='*.yml' --include='*.yaml'; then exit 1; fi
          echo 'Page gate and branding checks: PASS'

      - name: Validate published-state source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/index.html').read_text(encoding='utf-8', errors='ignore')
          lowered = text.lower()
          required = ['6 september 2026', 'computer supervisor']
          for item in required:
              assert item in lowered, f'missing current state: {item}'
          print('Current exam-state source checks: PASS')
          PY

      - name: Validate workflow hygiene
        shell: bash
        run: |
          set -euo pipefail
          if find .github/workflows -maxdepth 1 -type f \( -name '*.backup' -o -name '*.bak' -o -name '*.old' \) | grep -q .; then exit 1; fi
          echo 'Workflow hygiene: PASS'
