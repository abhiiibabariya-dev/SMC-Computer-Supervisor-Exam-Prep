name: Gujarat Government Jobs Monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'gujarat-monitor/smc_jobs.py'
      - 'gujarat-monitor/sources.json'
      - 'gujarat-monitor/sync_smc_site_status.py'
      - 'gujarat-monitor/inject_live_updates.py'
      - 'docs/auto-live-jobs.js'
      - '.github/workflows/smc-auto-monitor.yml'

permissions:
  contents: write

concurrency:
  group: gujarat-government-jobs-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan Gujarat government, municipal and SMC recruitment sources
        run: python3 gujarat-monitor/smc_jobs.py

      - name: Sync official SMC exam and recruitment status
        run: |
          python3 gujarat-monitor/sync_smc_site_status.py
          mkdir -p docs/gujarat-monitor
          cp gujarat-monitor/smc-status.json docs/gujarat-monitor/smc-status.json

      - name: Update every HTML page from official status
        run: python3 gujarat-monitor/inject_live_updates.py

      - name: Validate generated data and HTML
        run: |
          python3 -m json.tool gujarat-monitor/smc-status.json >/dev/null
          python3 -m json.tool gujarat-jobs.json >/dev/null
          test -f docs/auto-live-jobs.js
          test "$(find docs -type f -name '*.html' | wc -l)" -gt 0
          echo "Validation passed."

      - name: Show monitor report
        if: always()
        run: |
          echo '=== JOB MONITOR ==='
          test ! -f gujarat-monitor/jobs_report.json || cat gujarat-monitor/jobs_report.json
          echo '=== SMC STATUS ==='
          test ! -f gujarat-monitor/smc-status.json || cat gujarat-monitor/smc-status.json

      - name: Commit jobs, official status and all-page updates
        run: |
          git config user.name "Gujarat Jobs Monitor"
          git config user.email "actions@github.com"
          git add -A gujarat-monitor/jobs.json \
                  gujarat-monitor/jobs_state.json \
                  gujarat-monitor/jobs_report.json \
                  gujarat-monitor/smc-status.json \
                  gujarat-jobs.json \
                  gujarat-monitor/inject_live_updates.py \
                  gujarat-monitor/sync_smc_site_status.py \
                  docs
          if git diff --staged --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit -m "chore: refresh official SMC status and all pages"
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git rebase origin/master && git push origin master && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 8
          done
          echo "Unable to push after 5 attempts."
          exit 1
