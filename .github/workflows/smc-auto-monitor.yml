name: Gujarat Government Jobs Monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'gujarat-monitor/smc_jobs.py'
      - 'gujarat-monitor/sources.json'
      - 'gujarat-monitor/sync_smc_site_status.py'
      - 'gujarat-monitor/inject_live_updates.py'
      - 'docs/auto-live-jobs.js'
      - '.github/workflows/smc-auto-monitor.yml'

permissions:
  contents: write

concurrency:
  group: gujarat-government-jobs-monitor
  cancel-in-progress: true

jobs:
  monitor:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js for JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create last-good-data backup
        run: |
          mkdir -p .monitor-backup
          cp -f gujarat-jobs.json .monitor-backup/gujarat-jobs.json 2>/dev/null || true
          cp -f gujarat-monitor/jobs.json .monitor-backup/jobs.json 2>/dev/null || true
          cp -f gujarat-monitor/jobs_state.json .monitor-backup/jobs_state.json 2>/dev/null || true
          cp -f gujarat-monitor/jobs_report.json .monitor-backup/jobs_report.json 2>/dev/null || true
          cp -f gujarat-monitor/smc-status.json .monitor-backup/smc-status.json 2>/dev/null || true

      - name: Scan Gujarat government, municipal and SMC recruitment sources
        id: scan
        continue-on-error: true
        timeout-minutes: 14
        run: python3 gujarat-monitor/smc_jobs.py

      - name: Restore last good snapshot if scan failed
        if: steps.scan.outcome == 'failure'
        run: |
          echo "Monitor scan failed. Keeping the last known-good job snapshot."
          cp -f .monitor-backup/gujarat-jobs.json gujarat-jobs.json 2>/dev/null || true
          cp -f .monitor-backup/jobs.json gujarat-monitor/jobs.json 2>/dev/null || true
          cp -f .monitor-backup/jobs_state.json gujarat-monitor/jobs_state.json 2>/dev/null || true
          cp -f .monitor-backup/jobs_report.json gujarat-monitor/jobs_report.json 2>/dev/null || true

      - name: Sync official SMC exam and recruitment status
        timeout-minutes: 3
        run: |
          python3 gujarat-monitor/sync_smc_site_status.py
          mkdir -p docs/gujarat-monitor
          cp gujarat-monitor/smc-status.json docs/gujarat-monitor/smc-status.json

      - name: Safety-check job snapshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          backup_path = Path('.monitor-backup/jobs.json')
          current_path = Path('gujarat-monitor/jobs.json')
          report_path = Path('gujarat-monitor/jobs_report.json')
          if not current_path.exists(): raise SystemExit('Current job snapshot is missing.')
          current = json.loads(current_path.read_text(encoding='utf-8'))
          if not isinstance(current, list): raise SystemExit('Current job snapshot is not a list.')
          old = []
          if backup_path.exists():
              old = json.loads(backup_path.read_text(encoding='utf-8'))
              if not isinstance(old, list): old = []
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {}
          errors = report.get('errors') or []
          if old and errors and len(current) < int(len(old) * 0.80):
              raise SystemExit(f'Safety gate blocked publication: job count dropped from {len(old)} to {len(current)} while sources are failing.')
          if not current: raise SystemExit('Safety gate blocked publication: job snapshot is empty.')
          print(f'Safety gate passed: {len(current)} jobs, {len(errors)} source warnings.')
          PY

      - name: Update every HTML page from official status
        timeout-minutes: 3
        run: python3 gujarat-monitor/inject_live_updates.py

      - name: Repair public leaderboard flow
        shell: python
        run: |
          from pathlib import Path
          import re

          quiz = Path('docs/quiz.html')
          text = quiz.read_text(encoding='utf-8')
          pattern = re.compile(r"  function postLeaderboard\(s,sc,tot,secs\)\{.*?\n  \}", re.S)
          replacement = '''  function postLeaderboard(s,sc,tot,secs){
    if(!FB||!window.firebase||!firebase.auth)return;
    var user=firebase.auth().currentUser;
    if(!user)return;
    var p={}; try{p=JSON.parse(localStorage.getItem('smc_account')||'{}');}catch(e){}
    var rec={uid:user.uid,name:(p.name||user.displayName||'Anonymous'),subj:s,score:sc,total:tot,secs:secs,t:new Date().toISOString()};
    try{fetch(FB+'/leaderboard_public.json',{method:'POST',body:JSON.stringify(rec),headers:{'Content-Type':'application/json'}}).catch(function(){});}catch(e){}
  }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1: raise SystemExit('Could not locate quiz leaderboard writer.')
          quiz.write_text(text, encoding='utf-8')

          lb = Path('docs/leaderboard.html')
          lt = lb.read_text(encoding='utf-8')
          lt2 = lt.replace("FB+'/leaderboard.json'", "FB+'/leaderboard_public.json'")
          if lt2 == lt: raise SystemExit('Could not locate leaderboard reader.')
          lb.write_text(lt2, encoding='utf-8')

      - name: Validate generated data, live layer and all pages
        run: |
          set -euo pipefail
          python3 -m json.tool gujarat-monitor/smc-status.json >/dev/null
          python3 -m json.tool gujarat-jobs.json >/dev/null
          python3 -m json.tool gujarat-monitor/jobs_report.json >/dev/null
          test -f docs/auto-live-jobs.js
          node --check docs/auto-live-jobs.js
          node --check docs/gate.js
          test "$(find docs -type f -name '*.html' ! -name '*.backup.html' | wc -l)" -gt 0
          test "$(python3 -c 'import json; d=json.load(open("gujarat-jobs.json")); print(len(d.get("items", [])))')" -gt 0
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=[p for p in Path('docs').rglob('*.html') if not p.name.lower().endswith('.backup.html')]
          missing=[]; wrong=[]
          pattern=re.compile(r'<script\s+src="/SMC-Computer-Supervisor-Exam-Prep/auto-live-jobs\.js(?:\?[^" ]*)?"[^>]*></script>', re.I)
          for p in pages:
              t=p.read_text(encoding='utf-8',errors='ignore')
              if 'auto-live-jobs.js' not in t: missing.append(str(p))
              if not pattern.search(t): wrong.append(str(p))
          if missing: raise SystemExit('Pages missing global live layer: '+', '.join(missing))
          if wrong: raise SystemExit('Pages missing the correct GitHub Pages live-layer path: '+', '.join(wrong))
          print(f'Validated {len(pages)} HTML pages with the correct global live layer.')
          PY
          grep -q 'leaderboard_public.json' docs/quiz.html
          grep -q 'leaderboard_public.json' docs/leaderboard.html
          ! grep -q "mobile:(u.mobile" docs/quiz.html
          echo "Validation passed."

      - name: Show monitor report
        if: always()
        run: |
          echo '=== JOB MONITOR ==='
          test ! -f gujarat-monitor/jobs_report.json || cat gujarat-monitor/jobs_report.json
          echo '=== SMC STATUS ==='
          test ! -f gujarat-monitor/smc-status.json || cat gujarat-monitor/smc-status.json
          if [ "${{ steps.scan.outcome }}" = "failure" ]; then
            echo '=== WARNING ==='
            echo 'The source scan failed; last known-good job data was preserved.'
          fi

      - name: Commit and push updates safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gujarat-monitor gujarat-jobs.json docs .github/workflows/smc-auto-monitor.yml
          if git diff --staged --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit -m "chore: refresh official Gujarat and SMC updates [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin master
            if git rebase origin/master; then
              if git push origin HEAD:master; then
                echo "Repository update pushed successfully on attempt $attempt."
                exit 0
              fi
            else
              echo "Rebase failed on attempt $attempt; aborting rebase."
              git rebase --abort || true
            fi
            sleep $((attempt * 3))
          done
          echo '::error::Unable to push monitor update after 3 attempts.'
          exit 1
