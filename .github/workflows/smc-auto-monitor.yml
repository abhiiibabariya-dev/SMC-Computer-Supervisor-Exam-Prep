name: Gujarat Government Jobs Monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'gujarat-monitor/smc_jobs.py'
      - 'gujarat-monitor/sources.json'
      - 'gujarat-monitor/sync_smc_site_status.py'
      - 'gujarat-monitor/inject_live_updates.py'
      - 'docs/auto-live-jobs.js'
      - '.github/workflows/smc-auto-monitor.yml'

permissions:
  contents: write

concurrency:
  group: gujarat-government-jobs-monitor
  cancel-in-progress: true

jobs:
  monitor:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create last-good-data backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .monitor-backup
          for f in gujarat-jobs.json gujarat-monitor/jobs.json gujarat-monitor/jobs_state.json gujarat-monitor/jobs_report.json gujarat-monitor/smc-status.json; do
            if [ -f "$f" ]; then cp -f "$f" ".monitor-backup/$(basename "$f")"; fi
          done

      - name: Scan Gujarat and SMC recruitment sources
        id: scan
        continue-on-error: true
        timeout-minutes: 14
        run: python3 gujarat-monitor/smc_jobs.py

      - name: Restore last-good job snapshot after scan failure
        if: steps.scan.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Monitor scan failed. Restoring the last known-good job snapshot.'
          for f in gujarat-jobs.json jobs.json jobs_state.json jobs_report.json; do
            if [ -f ".monitor-backup/$f" ]; then
              case "$f" in
                gujarat-jobs.json) cp -f ".monitor-backup/$f" gujarat-jobs.json ;;
                *) cp -f ".monitor-backup/$f" "gujarat-monitor/$f" ;;
              esac
            fi
          done

      - name: Sync official SMC exam and recruitment status
        shell: bash
        run: |
          set -euo pipefail
          python3 gujarat-monitor/sync_smc_site_status.py
          mkdir -p docs/gujarat-monitor
          cp gujarat-monitor/smc-status.json docs/gujarat-monitor/smc-status.json

      - name: Safety-check job snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          current_path = Path('gujarat-monitor/jobs.json')
          backup_path = Path('.monitor-backup/jobs.json')
          report_path = Path('gujarat-monitor/jobs_report.json')
          if not current_path.exists():
              raise SystemExit('Current job snapshot is missing.')
          current = json.loads(current_path.read_text(encoding='utf-8'))
          if not isinstance(current, list) or not current:
              raise SystemExit('Safety gate blocked publication: job snapshot is empty or invalid.')
          old = json.loads(backup_path.read_text(encoding='utf-8')) if backup_path.exists() else []
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {}
          errors = report.get('errors') or []
          if isinstance(old, list) and old and errors and len(current) < int(len(old) * 0.80):
              raise SystemExit(f'Safety gate blocked publication: job count dropped from {len(old)} to {len(current)} while sources are failing.')
          print(f'Safety gate passed: {len(current)} jobs, {len(errors)} source warnings.')
          PY

      - name: Update HTML from official status
        run: python3 gujarat-monitor/inject_live_updates.py

      - name: Validate generated data and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool gujarat-monitor/smc-status.json >/dev/null
          python3 -m json.tool gujarat-jobs.json >/dev/null
          python3 -m json.tool gujarat-monitor/jobs_report.json >/dev/null
          node --check docs/auto-live-jobs.js
          node --check docs/gate.js
          node --check docs/leaderboard-safety.js
          node --check docs/quizscore-auth.js
          grep -q 'leaderboard_public.json' docs/quiz.html
          grep -q 'leaderboard_public.json' docs/leaderboard.html
          echo 'Monitor validation passed.'

      - name: Commit and push updates safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A gujarat-monitor gujarat-jobs.json docs .github/workflows/smc-auto-monitor.yml
          if git diff --staged --quiet; then
            echo 'No changes detected.'
            exit 0
          fi
          git commit -m 'chore: refresh official Gujarat and SMC updates'
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              echo "Repository update pushed successfully on attempt $attempt."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo '::error::Unable to push monitor update after 3 attempts.'
          exit 1
