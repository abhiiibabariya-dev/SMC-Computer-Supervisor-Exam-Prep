name: Set Firebase Security Rules

on:
  push:
    branches: [master]
    paths:
      - 'firebase-rules.json'
      - '.github/workflows/set-firebase-rules.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FIREBASE_URL: 'https://smc-exam-prep-38d22-default-rtdb.asia-southeast1.firebasedatabase.app'
  ADMIN_UID: '0fRWMa7HZgVYQrq4fzLjU3W130m1'

jobs:
  set-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate rules file
        shell: bash
        run: |
          set -euo pipefail
          test -s firebase-rules.json
          python3 -m json.tool firebase-rules.json >/dev/null
          grep -q '".read": false' firebase-rules.json
          grep -q '".write": false' firebase-rules.json
          grep -q "$ADMIN_UID" firebase-rules.json
          grep -q 'phoneVerified' firebase-rules.json
          grep -q 'quizscores' firebase-rules.json
          grep -q 'leaderboard' firebase-rules.json
          grep -q 'visits' firebase-rules.json
          grep -q 'security' firebase-rules.json
          echo 'Rules JSON and required security-path checks passed.'

      - name: Validate deployment credential
        env:
          FB_SECRET: ${{ secrets.FIREBASE_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FB_SECRET:-}" ]; then
            echo '::error::Repository secret FIREBASE_SECRET is missing.'
            echo 'Add or update FIREBASE_SECRET under Settings > Secrets and variables > Actions.'
            exit 1
          fi
          echo 'Firebase deployment credential is present.'

      - name: Deploy production rules
        env:
          FB_SECRET: ${{ secrets.FIREBASE_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f resp.txt
          HTTP=$(curl -sS -L --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 \
            -o resp.txt -w '%{http_code}' \
            -X PUT "${FIREBASE_URL}/.settings/rules.json?auth=${FB_SECRET}" \
            -H 'Content-Type: application/json' \
            --data-binary @firebase-rules.json)
          echo "Firebase rules API final HTTP $HTTP"
          cat resp.txt
          if [ "$HTTP" != "200" ]; then
            echo '::error::Firebase rejected the security rules. Check FIREBASE_SECRET and the Firebase project/database URL.'
            exit 1
          fi
          echo 'Production Firebase rules deployed successfully.'

      - name: Verify deployed rules match repository
        env:
          FB_SECRET: ${{ secrets.FIREBASE_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 \
            "${FIREBASE_URL}/.settings/rules.json?auth=${FB_SECRET}" \
            -o deployed-rules.json
          python3 - <<'PY'
          import json
          with open('firebase-rules.json', encoding='utf-8') as f: expected=json.load(f)
          with open('deployed-rules.json', encoding='utf-8') as f: actual=json.load(f)
          if expected != actual:
              raise SystemExit('Deployed Firebase rules do not exactly match firebase-rules.json')
          print('Deployed rules exactly match repository rules.')
          PY

      - name: Verify anonymous access is blocked
        shell: bash
        run: |
          set -euo pipefail
          R=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' "${FIREBASE_URL}/users/security-test.json")
          echo "Anonymous users read HTTP $R"
          test "$R" = "401"
          W=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' -X PUT "${FIREBASE_URL}/users/security-test.json" -H 'Content-Type: application/json' -d '{"uid":"security-test","plan":"premium99"}')
          echo "Anonymous users write HTTP $W"
          test "$W" = "401"

      - name: Verify sensitive paths are protected
        shell: bash
        run: |
          set -euo pipefail
          for path in users payment_requests audit security visits clicks leads quizscores; do
            code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' "${FIREBASE_URL}/${path}.json")
            echo "Anonymous ${path} read HTTP $code"
            test "$code" = "401"
            write_code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' -X POST "${FIREBASE_URL}/${path}.json" -H 'Content-Type: application/json' -d '{}')
            echo "Anonymous ${path} write HTTP $write_code"
            test "$write_code" = "401"
          done

      - name: Verify leaderboard is private and write-protected
        shell: bash
        run: |
          set -euo pipefail
          read_code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' "${FIREBASE_URL}/leaderboard.json")
          echo "Anonymous leaderboard read HTTP $read_code"
          test "$read_code" = "401"
          write_code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' -X POST "${FIREBASE_URL}/leaderboard.json" -H 'Content-Type: application/json' -d '{"name":"security-test","mobile":"","subj":"test","score":1,"total":1,"secs":1,"t":"2026-01-01T00:00:00Z"}')
          echo "Anonymous leaderboard write HTTP $write_code"
          test "$write_code" = "401"

      - name: Security rule deployment complete
        run: echo 'Firebase security-rule deployment and smoke tests passed.'
