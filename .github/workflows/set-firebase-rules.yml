name: Set Firebase Security Rules

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FIREBASE_URL: 'https://smc-exam-prep-38d22-default-rtdb.asia-southeast1.firebasedatabase.app'
  ADMIN_UID: 'OfRWMa7HZgVYQrq4fzLjU3Wl30ml'

jobs:
  set-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secret
        env:
          FB_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          if [ -z "$FB_SECRET" ]; then echo "::error::FIREBASE_SECRET is not set."; exit 1; fi
      - name: Write production rules
        run: |
          cat > rules.json <<'JSON'
          {"rules":{
            ".read":false,".write":false,
            "_healthcheck":{".read":false,".write":true},
            "admins":{"$uid":{".read":"auth !== null && auth.uid === $uid && auth.uid === 'OfRWMa7HZgVYQrq4fzLjU3Wl30ml'",".write":false}},
            "users":{"$uid":{
              ".read":"auth !== null && (auth.uid === $uid || auth.uid === 'OfRWMa7HZgVYQrq4fzLjU3Wl30ml')",
              ".write":"auth !== null && (auth.uid === 'OfRWMa7HZgVYQrq4fzLjU3Wl30ml' || (auth.uid === $uid && !data.exists()))",
              ".validate":"auth !== null && (auth.uid === 'OfRWMa7HZgVYQrq4fzLjU3Wl30ml' || (auth.uid === $uid && newData.child('uid').val() === $uid && newData.child('plan').val() === 'free' && newData.child('subscriptionStatus').val() === 'none' && newData.child('entitlements').child('mockTests').val() === false && newData.child('entitlements').child('fullAccess').val() === false))"
            }},
            "payment_requests":{".read":"auth !== null && auth.uid === 'OfRWMa7HZgVYQrq4fzLjU3Wl30ml'","$orderId":{
              ".read":"auth !== null && (auth.uid === 'OfRWMa7HZgVYQrq4fzLjU3Wl30ml' || data.child('uid').val() === auth.uid)",
              ".write":"auth !== null && (auth.uid === 'OfRWMa7HZgVYQrq4fzLjU3Wl30ml' || (!data.exists() && newData.child('uid').val() === auth.uid && newData.child('status').val() === 'pending' && (newData.child('plan').val() === 'premium49' || newData.child('plan').val() === 'premium99')))",
              ".validate":"newData.child('orderId').val() === $orderId && newData.child('uid').isString() && newData.child('status').isString()"
            }},
            "premium_content":{"$resource":{
              ".read":"auth !== null && root.child('users').child(auth.uid).child('subscriptionStatus').val() === 'active' && (root.child('users').child(auth.uid).child('expiresAt').val() === null || root.child('users').child(auth.uid).child('expiresAt').val() === '' || root.child('users').child(auth.uid).child('expiresAt').val() > now)",
              ".write":"auth !== null && auth.uid === 'OfRWMa7HZgVYQrq4fzLjU3Wl30ml'"
            }},
            "visits":{"$id":{".write":"!data.exists()"}},"clicks":{"$id":{".write":"!data.exists()"}},"leads":{"$id":{".write":"!data.exists()"}},"security":{"$id":{".write":"!data.exists()"}},"quizscores":{"$id":{".write":"!data.exists()"}},"leaderboard":{".read":true,"$id":{".write":"!data.exists()"}}
          }}
          JSON
      - name: Install rules
        env:
          FB_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          set -e
          HTTP=$(curl -s -o resp.txt -w '%{http_code}' -X PUT "${FIREBASE_URL}/.settings/rules.json?auth=${FB_SECRET}" -H 'Content-Type: application/json' --data-binary @rules.json)
          echo "HTTP $HTTP"; cat resp.txt; test "$HTTP" = "200"
      - name: Verify anonymous access remains blocked
        run: |
          set -e
          R=$(curl -s -o /dev/null -w '%{http_code}' "${FIREBASE_URL}/users/test.json"); echo "Anonymous read HTTP $R"; test "$R" = "401"
          W=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "${FIREBASE_URL}/users/test.json" -H 'Content-Type: application/json' -d '{"uid":"test","plan":"premium99"}'); echo "Anonymous write HTTP $W"; test "$W" = "401"
      - name: Purge diagnostic record
        env:
          FB_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          curl -s -X DELETE "${FIREBASE_URL}/_healthcheck.json?auth=${FB_SECRET}" -o /dev/null || true
          echo "Rules deployed and diagnostic record removed."
