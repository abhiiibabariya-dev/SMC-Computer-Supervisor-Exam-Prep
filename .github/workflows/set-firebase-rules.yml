name: Set Firebase Security Rules

on:
  push:
    branches: [master]
    paths:
      - 'firebase-rules.json'
      - '.github/workflows/set-firebase-rules.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FIREBASE_URL: 'https://smc-exam-prep-38d22-default-rtdb.asia-southeast1.firebasedatabase.app'
  ADMIN_UID: 'OfRWMa7HZgVYQrq4fzLjU3Wl30ml'

jobs:
  set-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate rules file
        run: |
          set -euo pipefail
          test -s firebase-rules.json
          python3 -m json.tool firebase-rules.json >/dev/null
          grep -q '".read": false' firebase-rules.json
          grep -q '".write": false' firebase-rules.json
          grep -q "$ADMIN_UID" firebase-rules.json
          echo 'Rules JSON and default-deny checks passed.'

      - name: Validate deployment credential
        env:
          FB_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${FB_SECRET:-}" ]; then
            echo '::error::FIREBASE_SECRET is missing. Add/update the repository Actions secret before production rules can be deployed.'
            exit 1
          fi
          echo 'Firebase deployment credential is present.'

      - name: Deploy production rules
        env:
          FB_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o resp.txt -w '%{http_code}' -X PUT "${FIREBASE_URL}/.settings/rules.json?auth=${FB_SECRET}" -H 'Content-Type: application/json' --data-binary @firebase-rules.json)
          echo "Firebase rules API HTTP $HTTP"
          cat resp.txt
          test "$HTTP" = "200"

      - name: Verify anonymous access is blocked
        run: |
          set -euo pipefail
          R=$(curl -sS -o /dev/null -w '%{http_code}' "${FIREBASE_URL}/users/security-test.json")
          echo "Anonymous read HTTP $R"
          test "$R" = "401"
          W=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "${FIREBASE_URL}/users/security-test.json" -H 'Content-Type: application/json' -d '{"uid":"security-test","plan":"premium99"}')
          echo "Anonymous write HTTP $W"
          test "$W" = "401"

      - name: Verify sensitive paths are not publicly readable
        run: |
          set -euo pipefail
          for path in users payment_requests audit security; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${FIREBASE_URL}/${path}.json")
            echo "Anonymous ${path} read HTTP $code"
            test "$code" = "401"
          done
          echo 'Production rule verification passed.'
