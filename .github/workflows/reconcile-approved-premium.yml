name: Reconcile Approved Premium Access

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/reconcile-approved-premium.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-premium
  cancel-in-progress: true

env:
  FIREBASE_URL: 'https://smc-exam-prep-38d22-default-rtdb.asia-southeast1.firebasedatabase.app'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile approved payment records
        env:
          FB_SECRET: ${{ secrets.FIREBASE_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FB_SECRET:-}"

          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error, time

          base = os.environ['FIREBASE_URL'].rstrip('/')
          secret = os.environ['FB_SECRET']

          def get(path):
              url = f"{base}/{path}.json?auth={urllib.parse.quote(secret, safe='')}"
              max_retries = 3
              for attempt in range(max_retries):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          data = json.load(r)
                          return data or {}
                  except (urllib.error.URLError, urllib.error.HTTPError, json.JSONDecodeError, TimeoutError) as e:
                      if attempt == max_retries - 1:
                          print(f"Failed to fetch {path} after {max_retries} attempts: {e}")
                          return {}
                      time.sleep(2 ** attempt)
              return {}

          def patch(path, payload):
              url = f"{base}/{path}.json?auth={urllib.parse.quote(secret, safe='')}"
              data = json.dumps(payload).encode()
              max_retries = 3
              for attempt in range(max_retries):
                  try:
                      req = urllib.request.Request(url, data=data, method='PATCH', headers={'Content-Type':'application/json'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read()
                          if body:
                              try:
                                  return json.loads(body)
                              except json.JSONDecodeError:
                                  return body.decode()
                          return {}
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError) as e:
                      if attempt == max_retries - 1:
                          print(f"Failed to patch {path} after {max_retries} attempts: {e}")
                          return None
                      time.sleep(2 ** attempt)
              return None

          def deep_equal(a, b):
              if isinstance(a, dict) and isinstance(b, dict):
                  if set(a.keys()) != set(b.keys()):
                      return False
                  return all(deep_equal(a[k], b[k]) for k in a)
              if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
                  if len(a) != len(b):
                      return False
                  return all(deep_equal(x, y) for x, y in zip(a, b))
              if a is None and b is None:
                  return True
              return a == b

          def norm_email(v):
              return str(v or '').strip().lower()

          def norm_phone(v):
              digits = ''.join(ch for ch in str(v or '') if ch.isdigit())
              if len(digits) >= 10:
                  return digits[-10:]
              return digits

          def classify_plan(req):
              plan = str(req.get('approvedPlan') or req.get('plan') or '').strip()
              if plan in ('premium99', 'premium199'):
                  return plan
              amount = req.get('amount')
              try:
                  amt = float(amount)
              except (TypeError, ValueError):
                  amt = None
              if amt == 99:
                  return 'premium99'
              if amt == 199:
                  return 'premium199'
              label = str(req.get('planLabel') or '').replace('₹', '').replace('Rs', '').replace('rs', '')
              if '99' in label and '199' not in label:
                  return 'premium99'
              if '199' in label:
                  return 'premium199'
              return None

          def payments_iterable(raw):
              if isinstance(raw, dict):
                  return raw.items()
              if isinstance(raw, list):
                  return ((str(i), v) for i, v in enumerate(raw) if v)
              return []

          def users_iterable(raw):
              if isinstance(raw, dict):
                  return raw.items()
              if isinstance(raw, list):
                  return ((str(i), v) for i, v in enumerate(raw) if v)
              return []

          raw_payments = get('payment_requests')
          raw_users = get('users')
          repaired = 0
          skipped = 0
          errors = 0
          matched_by = {'uid': 0, 'email': 0, 'phone': 0}

          users = {}
          email_index = {}
          phone_index = {}
          for user_uid, profile in users_iterable(raw_users):
              if not isinstance(profile, dict):
                  continue
              users[str(user_uid)] = profile
              email = norm_email(profile.get('email'))
              phone = norm_phone(profile.get('mobile') or profile.get('phone'))
              if email:
                  email_index[email] = str(user_uid)
              if len(phone) == 10:
                  phone_index[phone] = str(user_uid)

          for order_id, req in payments_iterable(raw_payments):
              if not isinstance(req, dict):
                  skipped += 1
                  continue

              status = str(req.get('status') or '').strip().lower()
              if status != 'approved':
                  continue

              uid = str(req.get('uid') or '').strip()
              matched = 'uid'
              if not uid or uid not in users:
                  email = norm_email(req.get('email'))
                  phone = norm_phone(req.get('phone') or req.get('mobile'))
                  recovered = email_index.get(email, '') if email else ''
                  if recovered:
                      uid = recovered
                      matched = 'email'
                  elif len(phone) == 10:
                      recovered = phone_index.get(phone, '')
                      if recovered:
                          uid = recovered
                          matched = 'phone'
              if not uid or uid not in users:
                  skipped += 1
                  print(f"SKIP no matching user for order {order_id} uid={req.get('uid')} email={req.get('email')} phone={req.get('phone') or req.get('mobile')}")
                  continue

              plan = classify_plan(req)
              if plan not in ('premium99', 'premium199'):
                  skipped += 1
                  print(f"SKIP unknown plan for order {order_id} plan={req.get('plan')} amount={req.get('amount')}")
                  continue

              expected = {
                  'plan': plan,
                  'planLabel': 'Premium ₹99' if plan == 'premium99' else 'Premium ₹199',
                  'subscriptionStatus': 'active',
                  'expiresAt': None,
                  'entitlements': {'mockTests': True, 'fullAccess': plan == 'premium199'},
              }
              user = users.get(uid) or {}
              mismatch = False
              for k, v in expected.items():
                  if not deep_equal(user.get(k), v):
                      mismatch = True
                      break
              if mismatch:
                  result = patch(f'users/{urllib.parse.quote(uid, safe="")}', expected)
                  if result is not None:
                      repaired += 1
                      matched_by[matched] += 1
                      print(f"REPAIRED user {uid} order {order_id} matched_by={matched} plan={plan}")
                  else:
                      errors += 1
                      print(f"ERROR patching user {uid} for order {order_id}")

          print(f'Reconciled approved premium accounts: {repaired}')
          print(f'Matched accounts by identity: {matched_by}')
          print(f'Skipped unmatched/unknown-plan: {skipped}')
          print(f'Errors: {errors}')
          PY
