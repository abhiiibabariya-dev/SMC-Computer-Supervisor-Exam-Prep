<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscription Admin | Gujarat Govt Jobs Hub</title><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><style>body{margin:0;background:#08090b;color:#d4d4d8;font:15px system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#111317;border:1px solid #27272a;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}h1,h2{color:#fff}label{display:block;color:#a1a1aa;font-size:12px;font-weight:700;margin:10px 0 5px}input,select{width:100%;box-sizing:border-box;background:#090a0c;color:#fff;border:1px solid #3f3f46;border-radius:10px;padding:11px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:#86efac;color:#07130b;margin-top:10px}.alt{background:#27272a;color:#fff}.danger{background:#3b161b;color:#fca5a5}.purple{background:#211b38;color:#c4b5fd}.muted{color:#a1a1aa;font-size:13px;line-height:1.5}.ok{color:#86efac}.err{color:#fca5a5}.row{display:flex;gap:8px;flex-wrap:wrap}.request{border-top:1px solid #27272a;padding:14px 0}.request:first-child{border-top:0}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#27272a;font-size:11px;font-weight:800}.pending{color:#fde68a}.approved{color:#86efac}.rejected{color:#fca5a5}</style></head><body><div class="wrap"><div class="card"><h1>Subscription Administration</h1><div id="who" class="muted">Checking administrator account...</div><p class="muted">Firebase is the source of truth. Both Premium ₹49 Mock Tests and Premium ₹99 Full Access are supported.</p><div class="row"><a class="btn alt" href="client-dashboard.html">My Profile</a><button id="logout" class="btn danger">Sign out</button></div></div><div class="grid"><div class="card"><h2>Grant / Sync Subscription</h2><label>Firebase UID</label><input id="uid" placeholder="Customer Firebase UID"><label>Name</label><input id="name" placeholder="Customer name"><label>Email</label><input id="email" type="email" placeholder="Customer email"><label>Plan</label><select id="plan"><option value="premium49">Premium ₹49 • Mock Tests</option><option value="premium99" selected>Premium ₹99 • Full Access</option></select><label>Access duration</label><select id="expiry"><option value="LIFETIME" selected>Lifetime</option><option value="30D">30 days</option><option value="90D">90 days</option></select><button id="grant" class="btn purple">Grant Selected Plan</button><div id="grantMsg" class="muted"></div></div><div class="card"><h2>Payment Requests</h2><div id="summary" class="muted">Loading...</div><div id="list"></div></div></div></div><script>(function(){'use strict';const ADMIN_UID='0fRWMa7HZgVYQrq4fzLjU3W130m1',ADMIN_EMAIL='abhibabariya007@gmail.com',cfg=window.SMC_FIREBASE_CONFIG||{};const $=id=>document.getElementById(id);if(!cfg.apiKey){$('who').textContent='Firebase configuration unavailable.';return}if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.database();function isAdmin(u){return !!u&&((u.uid===ADMIN_UID)||((u.email||'').toLowerCase()===ADMIN_EMAIL&&u.emailVerified===true))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function expiry(){const v=$('expiry').value;if(v==='LIFETIME')return null;const d=new Date();d.setDate(d.getDate()+(v==='30D'?30:90));return d.toISOString()}function planInfo(){return $('plan').value==='premium49'?{plan:'premium49',label:'Premium ₹49',mock:true,full:false}:{plan:'premium99',label:'Premium ₹99',mock:true,full:true}}async function grant(uid,name,email){const p=planInfo();if(!uid||uid.length<10)throw new Error('Enter a valid Firebase UID.');await db.ref('users/'+uid).update({uid:uid,email:email||'',name:name||'',plan:p.plan,planLabel:p.label,subscriptionStatus:'active',expiresAt:expiry(),entitlements:{mockTests:p.mock,fullAccess:p.full}});return p}async function load(){try{const s=await db.ref('payment_requests').once('value'),all=Object.values(s.val()||{}).filter(Boolean).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));$('summary').textContent=all.filter(x=>x.status==='pending').length+' pending request(s).';if(!all.length){$('list').innerHTML='<p class="muted">No payment requests.</p>';return}$('list').innerHTML=all.map((r,i)=>'<div class="request"><b style="color:#fff">'+esc(r.name||'User')+'</b><div class="muted">'+esc(r.email||'')+'<br>UID: '+esc(r.uid||'')+'<br>'+esc(r.planLabel||r.plan||'')+' • ₹'+esc(r.amount||'')+'<br>UTR: '+esc(r.txnId||'')+'<br>Order: '+esc(r.orderId||'')+'</div><span class="status '+esc(r.status||'')+'">'+esc(r.status||'unknown')+'</span><div class="row"><button class="btn" data-approve="'+i+'">Approve / Sync</button></div></div>').join('');document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{const r=all[+b.dataset.approve];if(!r.uid)return;const p=r.plan==='premium49'?{plan:'premium49',label:'Premium ₹49',mock:true,full:false}:{plan:'premium99',label:'Premium ₹99',mock:true,full:true};if(!confirm('Activate '+p.label+' for '+(r.email||r.uid)+'?'))return;try{await db.ref('users/'+r.uid).update({uid:r.uid,email:r.email||'',name:r.name||'',plan:p.plan,planLabel:p.label,subscriptionStatus:'active',expiresAt:null,entitlements:{mockTests:p.mock,fullAccess:p.full}});if(r.orderId)await db.ref('payment_requests/'+r.orderId).update({status:'approved',reviewedAt:new Date().toISOString(),reviewedBy:auth.currentUser.uid,approvedPlan:p.plan,approvedExpiresAt:null});alert(p.label+' activated.');await load()}catch(e){alert('Firebase denied the operation: '+(e.message||e))}})}catch(e){$('list').innerHTML='<p class="err">Unable to read payment requests: '+esc(e.message||e)+'</p>'}}$('grant').onclick=async()=>{const m=$('grantMsg');m.className='muted';try{const p=await grant($('uid').value.trim(),$('name').value.trim(),$('email').value.trim());m.textContent=p.label+' activated successfully.';m.className='ok'}catch(e){m.textContent=e.message||'Firebase denied the operation.';m.className='err'}};auth.onAuthStateChanged(u=>{if(!u){location.replace('login.html');return}if(!isAdmin(u)){location.replace('client-dashboard.html');return}$('who').innerHTML='Administrator verified';load()});$('logout').onclick=()=>auth.signOut().then(()=>location.replace('login.html'))})();</script></body></html>
