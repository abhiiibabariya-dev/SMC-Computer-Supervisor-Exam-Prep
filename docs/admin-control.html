<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Control | Gujarat Govt Jobs Hub</title><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script><style>body{margin:0;background:#08090b;color:#d4d4d8;font:14px system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:14px}.top,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top h1{color:#fff;margin:0;font-size:1.35rem}.who{color:#86efac;font-size:.72rem}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:#86efac;color:#06130a}.alt{background:#24252a;color:#fff}.danger{background:#3b161b;color:#fca5a5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.stat,.card{background:#111317;border:1px solid #27272a;border-radius:14px;padding:14px}.stat b{display:block;color:#fff;font-size:1.35rem}.stat span,.muted{color:#71717a;font-size:.68rem}.card{margin-top:11px}.card h2{color:#fff;font-size:1rem;margin:0 0 9px}.toolbar input,.toolbar select{background:#090a0c;color:#fff;border:1px solid #3f3f46;border-radius:9px;padding:9px}.toolbar input{flex:1;min-width:200px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:8px;border-bottom:1px solid #27272a;text-align:left;font-size:.72rem}th{color:#a1a1aa}.log{max-height:360px;overflow:auto;font:11px ui-monospace,monospace}.log div{padding:7px;border-bottom:1px solid #202124}.err{color:#fca5a5}.ok{color:#86efac}.badge{padding:3px 7px;border-radius:99px;font-size:10px;font-weight:900}.free{background:#27272a}.p99{background:#064e3b;color:#86efac}.p199{background:#211b38;color:#c4b5fd}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style>    <script src="/SMC-Computer-Supervisor-Exam-Prep/auto-live-jobs.js?v=20260824-5" defer></script>
</head><body><main class="wrap"><div class="top"><div><h1>🛡 Admin Control Center</h1><div id="who" class="who">Authenticating...</div></div><div style="margin-left:auto"><button id="refresh" class="btn">Refresh</button> <button id="logout" class="btn danger">Sign out</button></div></div><section class="grid"><div class="stat"><b id="total">0</b><span>Total accounts</span></div><div class="stat"><b id="free">0</b><span>Free</span></div><div class="stat"><b id="p199">0</b><span>Premium ₹199</span></div><div class="stat"><b id="p99">0</b><span>Premium ₹99</span></div></section><section class="card"><h2>👥 Users & Premium Status</h2><div class="toolbar"><input id="q" placeholder="Search name, email, mobile, UID"><select id="f"><option value="all">All</option><option value="free">Free</option><option value="premium99">Premium ₹99</option><option value="premium199">Premium ₹199</option><option value="pending">Pending</option></select></div><div id="um" class="muted">Loading...</div><div class="table"><table><thead><tr><th>User</th><th>Email</th><th>Mobile</th><th>Plan</th><th>Status</th><th>Access</th><th>Change</th></tr></thead><tbody id="users"></tbody></table></div></section><section class="card"><h2>💳 Payment Requests</h2><div id="pm" class="muted">Loading...</div><div class="table"><table><thead><tr><th>Time</th><th>User</th><th>Plan</th><th>Amount</th><th>UTR</th><th>Status</th><th>Action</th></tr></thead><tbody id="payments"></tbody></table></div></section><section class="card"><h2>🕵️ Security / Activity</h2><div class="toolbar"><button class="btn alt" data-log="audit">Audit</button><button class="btn alt" data-log="security">Security</button><button class="btn alt" data-log="visits">Visits</button><button class="btn alt" data-log="clicks">Clicks</button><button class="btn alt" data-log="leads">Visitor IDs</button></div><div id="log" class="log" style="margin-top:8px">Choose a log.</div></section><div id="msg" class="muted" style="text-align:center;margin:12px"></div></main><script>(function(){'use strict';const ADMIN='abhibabariya007@gmail.com',cfg=window.SMC_FIREBASE_CONFIG||{};let auth,db,data={};const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const email=v=>{v=String(v||'');if(!v.includes('@'))return v;let a=v.split('@');return(a[0][0]||'*')+'***@'+a[1]};const mobile=v=>{let n=String(v||'').replace(/\D/g,'');return n.length===10?'******'+n.slice(-4):'******'};const isAdmin=u=>!!u&&(u.email||'').toLowerCase()===ADMIN&&u.emailVerified===true;const plan=p=>p.plan==='premium199'?['Premium ₹199','p199']:p.plan==='premium99'?['Premium ₹99','p99']:['Free','free'];function msg(t,ok){$('msg').textContent=t||'';$('msg').className=ok?'ok':'err'}function render(){let q=$('q').value.toLowerCase().trim(),f=$('f').value,a=Object.values(data).filter(Boolean).filter(p=>{let s=[p.name,p.email,p.mobile,p.uid,p.plan,p.subscriptionStatus].join(' ').toLowerCase();if(q&&!s.includes(q))return false;return f==='all'||(f==='pending'?p.subscriptionStatus==='pending':p.plan===f)});$('um').textContent=a.length+' account(s) shown.';$('users').innerHTML=a.map(p=>{let[pl,cl]=plan(p),access=((p.entitlements&&p.entitlements.mockTests)?'Mock ':'')+((p.entitlements&&p.entitlements.fullAccess)?'Full':'')||'None';return'<tr><td>'+esc(p.name||'Account')+'<br><span class="muted">'+esc(p.uid||'')+'</span></td><td>'+esc(email(p.email))+'</td><td>'+esc(mobile(p.mobile))+'</td><td><span class="badge '+cl+'">'+esc(pl)+'</span></td><td>'+esc(p.subscriptionStatus||'none')+'</td><td>'+esc(access)+'</td><td><select data-u="'+esc(p.uid)+'"><option value="free">Free</option><option value="premium99">₹99</option><option value="premium199">₹199</option></select> <button class="btn" data-s="'+esc(p.uid)+'">Save</button></td></tr>'}).join('')||'<tr><td colspan="7">No matching users.</td></tr>';document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>save(b.dataset.s))}async function save(uid){let v=document.querySelector('[data-u="'+CSS.escape(uid)+'"]').value,info=v==='premium199'?{l:'Premium ₹199',m:true,full:true}:v==='premium99'?{l:'Premium ₹99',m:true,full:false}:{l:'Free',m:false,full:false};try{await db.ref('users/'+uid).update({plan:v,planLabel:info.l,subscriptionStatus:v==='free'?'none':'active',expiresAt:null,entitlements:{mockTests:info.m,fullAccess:info.full},updatedAt:new Date().toISOString()});msg('Subscription updated.',true);await load()}catch(e){msg(e.message,false)}}async function payments(){try{let s=await db.ref('payment_requests').once('value'),a=Object.values(s.val()||{}).filter(Boolean);$('pm').textContent=a.length+' request(s).';$('payments').innerHTML=a.map(r=>'<tr><td>'+esc(r.createdAt||'—')+'</td><td>'+esc(r.name||'User')+'<br>'+esc(email(r.email))+'</td><td>'+esc(r.planLabel||r.plan)+'</td><td>₹'+esc(r.amount)+'</td><td>'+esc(r.txnId)+'</td><td>'+esc(r.status)+'</td><td><button class="btn" data-p="'+esc(r.orderId)+'">Approve</button></td></tr>').join('')||'<tr><td colspan="7">No requests.</td></tr>';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>approve(b.dataset.p))}catch(e){$('pm').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}async function approve(id){try{let s=await db.ref('payment_requests/'+id).once('value'),r=s.val();if(!r)return;let is199=r.plan==='premium199'||Number(r.amount)===199,pl=is199?'premium199':'premium99';await db.ref('users/'+r.uid).update({uid:r.uid,email:r.email||'',name:r.name||'',plan:pl,planLabel:is199?'Premium ₹199':'Premium ₹99',subscriptionStatus:'active',expiresAt:null,entitlements:{mockTests:true,fullAccess:is199},updatedAt:new Date().toISOString()});await db.ref('payment_requests/'+id).update({status:'approved',reviewedAt:new Date().toISOString(),reviewedBy:auth.currentUser.uid,approvedPlan:pl});msg('Payment approved.',true);await load()}catch(e){msg(e.message,false)}}async function logs(type){try{let s=await db.ref(type).limitToLast(100).once('value'),a=Object.values(s.val()||{}).reverse();$('log').innerHTML=a.map(x=>'<div><b>'+esc(email(x.email||x.name||'Anonymous'))+'</b> · '+esc(x.ev||x.level||x.type||'event')+' · '+esc(x.localTime||x.lt||x.t||x.time||'')+'<br>'+esc(x.msg||x.d||x.page||x.pg||x.x||'')+'</div>').join('')||'No records.'}catch(e){$('log').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}async function load(){try{await auth.currentUser.getIdToken(true);let s=await db.ref('users').once('value');data=s.val()||{};let c={free:0,premium99:0,premium199:0};Object.values(data).forEach(p=>{if(c[p.plan]!==undefined)c[p.plan]++});$('total').textContent=Object.keys(data).length;$('free').textContent=c.free;$('p99').textContent=c.premium99;$('p199').textContent=c.premium199;render();await payments()}catch(e){let errMsg = esc(e.message);if(errMsg.includes('permission_denied')){errMsg += '. This may be due to email case sensitivity in Firebase Auth. Please ensure your admin email is lowercase in Firebase Console or re-register with lowercase email.'}$('um').innerHTML='<span class="err">Firebase read failed: '+errMsg+'</span>'}}$('q').oninput=render;$('f').onchange=render;$('refresh').onclick=load;$('logout').onclick=()=>auth.signOut().then(()=>location.replace('login.html'));document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>logs(b.dataset.log));try{if(!cfg.apiKey||!cfg.authDomain||!cfg.appId||!cfg.databaseURL)throw new Error('Firebase config missing');if(!firebase.apps.length)firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.database();auth.onAuthStateChanged(async u=>{if(!u){location.replace('login.html');return}if(!isAdmin(u)){location.replace('client-dashboard.html');return}$('who').textContent='Administrator verified · '+email(u.email);await load()})}catch(e){$('who').textContent='Admin initialization failed';msg(e.message,false)}})();</script></body></html>
